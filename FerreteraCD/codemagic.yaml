workflows:
  ios-simulator-appetize:
    name: FerreteraCD - Build para simulador (Appetize.io)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "FerreteraCD.xcodeproj"
        XCODE_TARGET: "FerreteraCD"
        APP_NAME: "FerreteraCD"
        # El proyecto pide iOS 26.2; se baja solo en la compilación para que
        # Appetize.io pueda abrirlo en cualquier simulador iOS 17 o superior.
        DEPLOYMENT_TARGET: "17.0"
      # Opcional: crea un grupo "appetize" en Codemagic con la variable
      # APPETIZE_API_TOKEN para subir la app automáticamente a Appetize.io.
      # groups:
      #   - appetize
    triggering:
      events:
        - push
    scripts:
      - name: Información del proyecto
        script: |
          xcodebuild -version
          xcodebuild -list -project "$XCODE_PROJECT"

      - name: Compilar .app para el simulador de iOS
        script: |
          set -e
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -target "$XCODE_TARGET" \
            -configuration Debug \
            -sdk iphonesimulator \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET="$DEPLOYMENT_TARGET" \
            CONFIGURATION_BUILD_DIR="$CM_BUILD_DIR/build/simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Comprimir .app en .zip (formato que pide Appetize.io)
        script: |
          set -e
          cd "$CM_BUILD_DIR/build/simulator"
          ls -la
          ditto -c -k --sequesterRsrc --keepParent "$APP_NAME.app" "$CM_BUILD_DIR/$APP_NAME-simulator.zip"
          ls -la "$CM_BUILD_DIR/$APP_NAME-simulator.zip"

      - name: Subir a Appetize.io (solo si existe APPETIZE_API_TOKEN)
        script: |
          if [ -z "$APPETIZE_API_TOKEN" ]; then
            echo "APPETIZE_API_TOKEN no definido: descarga el .zip de los artefactos y súbelo manualmente en https://appetize.io/upload"
            exit 0
          fi
          curl --fail -sS -X POST https://api.appetize.io/v1/apps \
            -H "X-API-KEY: $APPETIZE_API_TOKEN" \
            -F "file=@$CM_BUILD_DIR/$APP_NAME-simulator.zip" \
            -F "platform=ios"

    artifacts:
      - FerreteraCD-simulator.zip
      - /tmp/xcodebuild_logs/*.log
